version: '3.8'

services:
  redis:
    image: redis:6.2.5
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - /data/redis/data:/data
    command: redis-server --appendonly yes
    # OPS-01：与 dev-compose 同款探活
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aideepin-api:
    image: adi-bootstrap:${IMAGE_VERSION}
    container_name: aideepin-api
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      APP_VERSION: ${APP_VERSION}
      TZ: ${TZ}
      APP_PROFILE: ${APP_PROFILE}
      JAVA_OPTS: ${JAVA_OPTS}
      ADI_DB_HOST: ${ADI_DB_HOST}
      ADI_DB_PORT: ${ADI_DB_PORT}
      ADI_DB_NAME: ${ADI_DB_NAME}
      ADI_DB_USERNAME: ${ADI_DB_USERNAME}
      ADI_DB_PASSWORD: ${ADI_DB_PASSWORD}
      ADI_REDIS_HOST: ${ADI_REDIS_HOST}
      ADI_REDIS_PORT: ${ADI_REDIS_PORT}
      ADI_REDIS_PASSWORD: ${ADI_REDIS_PASSWORD}
      ADI_MAIL_HOST: ${ADI_MAIL_HOST}
      ADI_MAIL_USERNAME: ${ADI_MAIL_USERNAME}
      ADI_MAIL_PASSWORD: ${ADI_MAIL_PASSWORD}
      ADI_ENCRYPT_AES_KEY: ${ADI_ENCRYPT_AES_KEY}
      # Neo4j (optional, uncomment if needed)
      # ADI_NEO4J_HOST: ${ADI_NEO4J_HOST}
      # ADI_NEO4J_PORT: ${ADI_NEO4J_PORT}
      # ADI_NEO4J_USERNAME: ${ADI_NEO4J_USERNAME}
      # ADI_NEO4J_PASSWORD: ${ADI_NEO4J_PASSWORD}
      # ADI_NEO4J_DATABASE: ${ADI_NEO4J_DATABASE}
    volumes:
      - /data/aideepin:/data/aideepin
      - /data/aideepin-logs:/data/aideepin-logs
    # OPS-01：探活 + 自愈 + 优雅停机（配合 Dockerfile 的 exec ENTRYPOINT，
    # stop_grace_period 需覆盖 lifecycle 的 60s 宽限期）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      redis:
        condition: service_healthy

  aideepin-user-web:
    container_name: aideepin-user-web
    build:
      context: ../user-web
      dockerfile: Dockerfile

  aideepin-admin-web:
    container_name: aideepin-admin-web
    build:
      context: ../admin-web
      dockerfile: Dockerfile

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - aideepin-api
      - aideepin-user-web
      - aideepin-admin-web
