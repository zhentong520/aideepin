# T0-01 质量门禁（任务书第 1 批）
# 放 aideepin 仓而非 E:/reg-project 根仓：根仓无 remote，workflow 永远不会触发。
# 触发：代码目录相关改动 push/PR + 手动。
# 门禁：后端全量测试（含 Testcontainers 集成测试，ubuntu runner 自带 Docker）
#      + 两端 build（type-check + i18n AST 守卫都在 build 链里，构造失败即红）。
name: ci

on:
  push:
    branches: ['**']
    paths:
      - 'server/**'
      - 'user-web/**'
      - 'admin-web/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'user-web/**'
      - 'admin-web/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (incl. integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all tests (surefire + testcontainers integration)
        working-directory: server
        run: mvn -B -pl adi-common,adi-chat,adi-admin,adi-integration-test -am test
      # OPT-10 防复发：test 只覆盖编译+测试，不含 adi-bootstrap 的 spring-boot repackage；
      # 依赖归属错误（如 JDBC 驱动放错模块）只在 package 装配阶段暴露，故全模块打包兜底。
      - name: Package all modules (assembly check, skip tests)
        working-directory: server
        run: mvn -B package -DskipTests
      - name: Schema sync gate (entities vs all_ddl.sql)
        working-directory: server
        run: bash db_migration/check_schema_sync.sh

  frontend-user:
    name: user-web build (type-check + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user-web/pnpm-lock.yaml
      - name: Install & build (build script runs i18n guard + type-check)
        working-directory: user-web
        run: pnpm install --frozen-lockfile && pnpm build

  frontend-admin:
    name: admin-web build (type-check + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: Install & build (build script runs i18n guard + type-check + postBuild)
        working-directory: admin-web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Assert no mock in production build (OPT-01 guard)
        working-directory: admin-web
        run: pnpm check:prod-no-mock

  docker-build:
    # OPT-09: three images must stay buildable — this is the gate that would have caught
    # P0-2 (Dockerfile module list drifting from server/pom.xml) before it hid for 6 days.
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend-user, frontend-admin]
    steps:
      - uses: actions/checkout@v4
      - name: Assert no .env files tracked (OPT-05 guard)
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::.env files must not be tracked (only .env.example)"; exit 1
          fi
      - name: Assert contract types up to date (OPT-12 gate)
        run: |
          cd packages/aideepin-api-types
          npm exec --yes openapi-typescript@7 openapi.json -o /tmp/schema-contract.d.ts
          if ! diff -q /tmp/schema-contract.d.ts src/schema.d.ts > /dev/null; then
            echo "::error::openapi.json and src/schema.d.ts are out of sync — run: pnpm --filter aideepin-api-types generate"
            diff /tmp/schema-contract.d.ts src/schema.d.ts | head -20
            exit 1
          fi
      - name: Assert toolchain major versions aligned (OPT-13 gate)
        run: |
          node -e "
          const a = require('./admin-web/package.json'), u = require('./user-web/package.json');
          const pick = (d, k) => (d.dependencies[k] || d.devDependencies[k] || '');
          for (const pkg of ['vite', '@vitejs/plugin-vue', 'naive-ui', 'tailwindcss', 'vue-tsc', 'vue-i18n', 'vue']) {
            const av = pick(a, pkg).replace(/[^0-9]/g, '').charAt(0);
            const uv = pick(u, pkg).replace(/[^0-9]/g, '').charAt(0);
            if (!av || !uv) continue;
            if (av !== uv) { console.error('::error::' + pkg + ' major differs: admin=' + av + ' user=' + uv); process.exit(1); }
          }
          console.log('toolchain majors aligned');
          "
      - name: jscpd workflow duplication gate (OPT-16)
        # 两端 wf 代码重复基线 11.25%（OPT-16 纯逻辑层收敛后实测）；
        # 阈值 12% 只拦恶化，组件层收敛（计划步骤②）后应下调。
        run: npx --yes jscpd --min-tokens 100 --threshold 12 --silent "admin-web/src/wf" "admin-web/src/views/wf-designer" "user-web/src/views/workflow"
      - name: Build server image
        run: docker build -t aideepin-api:sha-${{ github.sha }} ./server
      - name: Build user-web image (context = repo root, needs packages/aideepin-tokens)
        run: docker build -f user-web/Dockerfile -t aideepin-user-web:sha-${{ github.sha }} .
      - name: Build admin-web image (context = repo root, needs packages/aideepin-tokens)
        run: docker build -f admin-web/Dockerfile -t aideepin-admin-web:sha-${{ github.sha }} .
