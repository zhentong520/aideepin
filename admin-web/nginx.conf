server {
	listen 443 ssl;
	server_name localhost;
	charset utf-8;
	proxy_buffering off;
	error_page   500 502 503 504  /50x.html;

	# ===== T0-03 安全响应头（任务书第 1 批）=====
	# 全部 always：4xx/5xx 响应也必须带，防错误页泄露指纹
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	# ⚠️ 上线前验证：highlight.js 不走 eval；若控制台出现 CSP 违规报告再逐项放开，
	#    禁止直接加 unsafe-eval 了事
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

	ssl_certificate     /etc/nginx/ssl/localhost.pem;
	ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

  # 用户端WEB页面配置
  # 如果用户端WEB跟管理后台WEB不在同一台服务器上，注释本Location的配置
	# 访问地址：https://你的ip/
	location / {
		root /usr/share/nginx/adi-web;
   	index /index.html;
		# T0-03：恢复 try_files——SPA 直接访问子路由时回退 index.html
		try_files $uri $uri/ /index.html;
	}

  # 管理后台WEB页面配置
  # 访问地址：https://你的ip/admin
	# location中的 /admin 需要与.env.production中的VITE_PUBLIC_PATH设置的值相等
  location /admin/ {
    alias /data/adi-admin-web/;
   	index /index.html;
		# 路由使用history的方式时需要用try_files指定默认页面
		# hash方式可以屏蔽该配置
		try_files $uri $uri/ /admin/index.html;
  }

  # 后端服务
	location /api/ {
		# T0-03：proxy_set_header 必须写在 location 内——写在 server 末尾对
		# 已定义的 location 不继承，静态资源与代理行为会分叉
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header REMOTE-HOST $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://localhost:9999/;
	}
}
