# S1-01（2026-10-27）ArchUnit 冻结规则配置
# FreezingArchRule：存量违规入库存档（需提交进 git），之后只拦"新增"违规。
# 首次建档已在库；如需重置基线（例如 S1-02 清零后），显式运行：
#   mvn -pl adi-bootstrap test -Dtest=WholeAppArchitectureTest -Darchunit.freeze.refreeze=true
freeze.store.default.path=src/test/resources/archunit-store
freeze.store.default.allowStoreCreation=true
freeze.refreeze=false
